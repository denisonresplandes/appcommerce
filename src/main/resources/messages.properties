# Mensagens do Bean Validation (usadas nas anotações dos DTOs, no formato message = "{chave}").
# {min} e {max} são preenchidos com os valores da própria anotação (@Size), então os números ficam só no DTO.

### users: CreateUserRequest ###
user.name.required=user name is required
user.name.size=user name must have between {min} and {max} characters

user.email.required=user email address is required
user.email.invalid=user email address is invalid
user.email.size=user email address must have at most {max} characters

user.phone.required=user phone number is required
user.phone.size=user phone number must have {min} or {max} digits
user.phone.digits=user phone number must contain only digits

user.dateOfBirth.required=user date of birth is required
user.dateOfBirth.future=user date of birth cannot be later than now

### users: UserController (parâmetros de caminho e de consulta) ###
# O parâmetro email também usa user.email.required, user.email.invalid e user.email.size, definidas acima.
user.id.positive=user id must be a positive number
